name: Sync upstream v1.22.0

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'trigger/upstream-v1.22.0-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream v1.22.0
        run: |
          git remote add upstream https://github.com/openchamber/openchamber.git
          git fetch upstream refs/tags/v1.22.0:refs/tags/upstream-v1.22.0

      - name: Merge and re-apply fork-specific i18n
        shell: bash
        run: |
          set -euo pipefail
          git switch -C sync/upstream-v1.22.0
          cp packages/ui/src/lib/i18n/bootstrap.ts /tmp/bootstrap.fork.ts

          set +e
          git merge --no-ff --no-commit upstream-v1.22.0
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Merge conflicts:"
            echo "$conflicts"
            allowed='^(bun.lock|packages/ui/src/lib/i18n/(bootstrap.ts|intl.ts|runtime.ts|store.ts|messages/(en|es|fr|ja|ko|pl|pt-BR|uk|zh-CN|zh-TW)\.ts))$'
            unexpected=$(printf '%s\n' "$conflicts" | grep -Ev "$allowed" || true)
            if [ -n "$unexpected" ]; then
              echo "::error::Unexpected conflicts require manual review:"
              echo "$unexpected"
              exit 3
            fi
            git checkout --theirs -- bun.lock \
              packages/ui/src/lib/i18n/bootstrap.ts \
              packages/ui/src/lib/i18n/intl.ts \
              packages/ui/src/lib/i18n/runtime.ts \
              packages/ui/src/lib/i18n/store.ts \
              packages/ui/src/lib/i18n/messages/en.ts \
              packages/ui/src/lib/i18n/messages/es.ts \
              packages/ui/src/lib/i18n/messages/fr.ts \
              packages/ui/src/lib/i18n/messages/ja.ts \
              packages/ui/src/lib/i18n/messages/ko.ts \
              packages/ui/src/lib/i18n/messages/pl.ts \
              packages/ui/src/lib/i18n/messages/pt-BR.ts \
              packages/ui/src/lib/i18n/messages/uk.ts \
              packages/ui/src/lib/i18n/messages/zh-CN.ts \
              packages/ui/src/lib/i18n/messages/zh-TW.ts
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          base = Path('packages/ui/src/lib/i18n')

          p = base / 'runtime.ts'
          s = p.read_text()
          s = s.replace(" | 'tr';", " | 'tr' | 'ru';")
          s = s.replace("'ja', 'tr'] as const", "'ja', 'tr', 'ru'] as const")
          s = s.replace(" | 'common.language.turkish'>", " | 'common.language.turkish' | 'common.language.russian'>")
          s = s.replace("  tr: 'common.language.turkish',\n", "  tr: 'common.language.turkish',\n  ru: 'common.language.russian',\n")
          marker = "  if (normalized === 'tr' || normalized.startsWith('tr-')) {\n    return 'tr';\n  }\n"
          if marker not in s:
              raise SystemExit('runtime.ts Turkish locale marker not found')
          s = s.replace(marker, marker + "  if (normalized === 'ru' || normalized.startsWith('ru-')) {\n    return 'ru';\n  }\n")
          p.write_text(s)

          p = base / 'intl.ts'
          s = p.read_text()
          if "  tr: 'tr-TR',\n" not in s:
              raise SystemExit('intl.ts Turkish locale marker not found')
          p.write_text(s.replace("  tr: 'tr-TR',\n", "  tr: 'tr-TR',\n  ru: 'ru-RU',\n"))

          p = base / 'store.ts'
          s = p.read_text()
          marker = "                    : locale === 'tr'\n                      ? await import('./messages/tr') as { dict: I18nDictionary }\n                      : { dict: enDict };"
          if marker not in s:
              raise SystemExit('store.ts Turkish locale marker not found')
          repl = "                    : locale === 'tr'\n                      ? await import('./messages/tr') as { dict: I18nDictionary }\n                      : locale === 'ru'\n                        ? await import('./messages/ru') as { dict: I18nDictionary }\n                        : { dict: enDict };"
          p.write_text(s.replace(marker, repl))

          old = Path('/tmp/bootstrap.fork.ts').read_text()
          m = re.search(r"\nconst RU_MESSAGES: BootstrapMessages = \{.*?\n\};\n", old, re.S)
          if not m:
              raise SystemExit('RU bootstrap block not found in fork')
          p = base / 'bootstrap.ts'
          s = p.read_text()
          if 'const TR_MESSAGES: BootstrapMessages' not in s:
              raise SystemExit('bootstrap.ts Turkish block not found')
          s = s.replace('\nconst TR_MESSAGES: BootstrapMessages', m.group(0) + '\nconst TR_MESSAGES: BootstrapMessages', 1)
          s = s.replace("  tr: TR_MESSAGES,\n", "  tr: TR_MESSAGES,\n  ru: RU_MESSAGES,\n")
          p.write_text(s)

          translations = {
              'en.ts': 'Russian', 'de.ts': 'Russisch', 'fr.ts': 'Russe',
              'zh-CN.ts': '俄语', 'zh-TW.ts': '俄語', 'uk.ts': 'Російська',
              'es.ts': 'Ruso', 'pt-BR.ts': 'Russo', 'ko.ts': '러시아어',
              'pl.ts': 'Rosyjski', 'ja.ts': 'ロシア語', 'tr.ts': 'Rusça',
          }
          messages = base / 'messages'
          for fn, value in translations.items():
              p = messages / fn
              s = p.read_text()
              if 'common.language.russian' in s:
                  continue
              lines = s.splitlines(True)
              for i, line in enumerate(lines):
                  if 'common.language.turkish' in line:
                      quote = '"' if '"common.language.turkish"' in line else "'"
                      lines.insert(i + 1, f"  {quote}common.language.russian{quote}: {quote}{value}{quote},\n")
                      break
              else:
                  raise SystemExit(f'Turkish language label marker not found in {fn}')
              p.write_text(''.join(lines))

          en_text = (messages / 'en.ts').read_text()
          key_re = re.compile(r'^\s*[\'\"]([^\'\"]+)[\'\"]\s*:', re.M)
          upstream_keys = set(key_re.findall(en_text))
          ru_path = messages / 'ru.ts'
          ru_lines = ru_path.read_text().splitlines(True)
          kept = []
          removed = []
          line_re = re.compile(r'^\s*[\'\"]([^\'\"]+)[\'\"]\s*:')
          for line in ru_lines:
              m = line_re.match(line)
              if m and m.group(1) not in upstream_keys:
                  removed.append(m.group(1))
                  continue
              kept.append(line)
          ru_path.write_text(''.join(kept))
          if removed:
              print('Removed stale RU keys:')
              for key in removed:
                  print(f'  - {key}')
          PY

          bun install --lockfile-only
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 4
          fi
          git commit -m "sync: merge upstream v1.22.0 and preserve RU fork patches"

      - name: Verify fork-specific invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'ru'" packages/ui/src/lib/i18n/runtime.ts
          grep -q "common.language.russian" packages/ui/src/lib/i18n/messages/en.ts
          grep -q "await import('./messages/ru')" packages/ui/src/lib/i18n/store.ts
          grep -q 'cron-parser' package.json
          grep -q '"@opencode-ai/sdk": "1.18.25"' package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Build web
        run: bun run build:web

      - name: Push reviewed sync branch
        run: git push --set-upstream origin sync/upstream-v1.22.0
