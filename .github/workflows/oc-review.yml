name: Telegram change quality gate

on:
  push:
    branches:
      - feature/telegram-notifications-v2

permissions:
  contents: read

jobs:
  check-changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Telegram regressions
        run: |
          cd packages/web
          bun run test server/lib/notifications/telegram-watch.test.js server/lib/notifications/telegram-delivery.test.js server/lib/notifications/telegram-approval.test.js server/lib/notifications/telegram-routes.test.js server/lib/opencode/session-activity.test.js server/lib/spaces/space-fetch.test.js server/lib/openchamber-control/service.test.js server/lib/agent-tool/runtime.test.js
      - name: Real OpenCode v2 API smoke (no model, no Telegram credentials)
        timeout-minutes: 8
        run: |
          curl -fsSL --retry 3 https://opencode.ai/v2/install -o "$RUNNER_TEMP/opencode-install.sh"
          bash "$RUNNER_TEMP/opencode-install.sh" --version 2.0.32 --no-modify-path
          OPENCODE_SMOKE_BINARY="$HOME/.opencode/bin/opencode" node scripts/telegram-opencode-v2-smoke.mjs
      - name: Check changed source files
        run: bun run check:changed
      - name: Build web UI
        run: bun run build:web
