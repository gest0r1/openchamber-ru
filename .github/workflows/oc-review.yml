name: Telegram change quality gate

on:
  push:
    branches:
      - feature/telegram-notifications-v2

permissions:
  contents: read

jobs:
  check-changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Telegram regressions
        run: |
          cd packages/web
          bun run test server/lib/notifications/telegram-watch.test.js server/lib/notifications/telegram-delivery.test.js server/lib/notifications/telegram-approval.test.js server/lib/opencode/session-activity.test.js
      - name: Check changed source files
        run: bun run check:changed
      - name: Build web UI
        run: bun run build:web
