name: pr checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR makes the older run pointless.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Independent checks use runners available to the fork.
jobs:
  type-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run type-check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Changelog outputs match their sources
        run: bun run changelog:check

  # Independent P1 verification: global upstream merge checks may fail while
  # the root/opencode Git staging boundary must still be exercised in real UIDs.
  guest-git-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Non-root extension checkout tests
        run: bun run --cwd packages/web test -- server/lib/guests/root-guest-checkout.test.js
      - name: Real UID root to nobody Git clone and read-only adoption
        run: sudo -n env PATH="$PATH" bun run --cwd packages/web test -- server/lib/guests/root-guest-checkout.test.js

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Telegram SDK shadow Node service contracts
        run: node --test extensions/telegram-shadow/service/state.test.js extensions/telegram-shadow/service/http.test.js extensions/telegram-shadow/service/migration.test.js
      - name: Telegram SDK notifier Node service contracts
        run: node --test extensions/telegram-notifier/service/reconcile.test.js extensions/telegram-notifier/service/http.test.js
      - name: P1 root PTY privilege boundary contracts
        run: node --test packages/web/server/lib/root-execution-boundary.contract.mjs packages/web/server/lib/owner-checkpoint-routes.contract.mjs
      - name: P1 extension service real UID boundary
        run: sudo -n env PATH="$PATH" node --test packages/web/server/lib/guests/root-service-runtime.contract.mjs
      - name: P1 root worktree and Git real UID boundary
        run: bash scripts/tests/p1-root-worktree-uid-smoke.sh
      - name: Tests
        run: bun run test
      - name: Fork release and agent entrypoint contracts
        run: |
          node scripts/check-fork-release-policy.mjs
          node scripts/check-agent-entrypoints.mjs
          node --test scripts/reuse-release-web-package.test.mjs scripts/release-workflow-contract.test.mjs
      - name: Electron Linux packaging unit tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

  # Catches what type-check cannot: bundling, Vite-only syntax, the web
  # build's memory ceiling. The packages whose `build` is only a type-check (`tsc -b`)
  # (ui) or a no-op (electron) are covered by the type-check job.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web
        run: bun run --cwd packages/web build
      - name: Validate root-compatible packaged web runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/oc-p1-package"
          (cd packages/web && bun pm pack --destination "$RUNNER_TEMP/oc-p1-package")
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/oc-p1-package/*.tgz)
          [[ "${#packages[@]}" == 1 ]] || { echo 'Expected one OpenChamber package' >&2; exit 1; }
          export BUN_INSTALL="$RUNNER_TEMP/oc-p1-bun"
          bun add -g --ignore-scripts "${packages[0]}"
          test "$("$BUN_INSTALL/bin/openchamber" --version | sed -E 's/^OpenChamber[[:space:]]+v?//;s/^v//')" = "$(node -p 'require("./packages/web/package.json").version')"
          "$BUN_INSTALL/bin/openchamber" serve --help >/dev/null
      - name: Build VS Code extension
        run: bun run --cwd packages/vscode build
      - name: Prepare mobile web assets
        run: bun run --cwd packages/mobile build:assets
