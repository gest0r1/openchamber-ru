name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_run:
    workflows: ['OpenChamber V2 Linux web package']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  authorize-release:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    outputs:
      proceed: ${{ steps.identity.outputs.proceed }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve immutable release request
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            version=$(node -p "require('./.github/release-request.json').version")
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="$version" node - <<'NODE'
          for (const file of ['package.json', 'packages/web/package.json', 'packages/electron/package.json']) {
            if (require('./' + file).version !== process.env.VERSION) throw Error(`Release version mismatch: ${file}`);
          }
          NODE
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$EVENT_NAME" != workflow_run ]]; then
              echo 'Release already exists; refusing to overwrite it' >&2; exit 1
            fi
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          fi


  create-release:
    needs: authorize-release
    if: ${{ needs.authorize-release.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ needs.authorize-release.outputs.source_sha }}
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize-release.outputs.source_sha }}

      - name: Get version
        id: get_version
        env:
          VERSION: ${{ needs.authorize-release.outputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for release
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          title=$(node scripts/changelog/release-notes.mjs "$VERSION" artifacts/release-notes.md)
          echo "name=OpenChamber v$VERSION: $title" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          target_commitish: ${{ needs.authorize-release.outputs.source_sha }}
          draft: true
          generate_release_notes: false
          body_path: artifacts/release-notes.md
          name: ${{ steps.release_notes.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-web:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.source_sha }}

      - name: Reuse the verified exact-SHA web package
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: node scripts/reuse-release-web-package.mjs

      - name: Upload npm tarball to release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: packages/web/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-desktop-electron-windows:
    needs: create-release
    # windows-latest currently resolves to a runner with Visual Studio 18,
    # which this electron/node-gyp stack does not detect correctly.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.source_sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        # npmRebuild=false in package.json, so electron-builder won't
        # recompile native deps on its own — we must rebuild against the
        # target Electron ABI before packaging.
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Validate Windows update manifest
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: node packages/electron/scripts/verify-update-manifest.mjs packages/electron/dist/latest.yml "packages/electron/dist/OpenChamber-${VERSION}-win-x64.exe" "$VERSION"

      - name: Upload installer to release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-electron-linux:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            host_arch: x86_64
            artifact_arch: x86_64
            manifest: latest-linux.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.source_sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify native Linux architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$OPENCHAMBER_TARGET_ARCH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Build and package Linux AppImage
        working-directory: packages/electron
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-appimage

      - name: Validate Linux update manifest
        working-directory: packages/electron
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          APPIMAGE="dist/OpenChamber-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage"
          node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$APPIMAGE" "$VERSION"

      - name: Publish validated Linux release files
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: |
            packages/electron/dist/OpenChamber-${{ needs.create-release.outputs.version }}-linux-${{ matrix.artifact_arch }}.AppImage
            packages/electron/dist/${{ matrix.manifest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-release:
    needs: create-release
    if: ${{ github.event.inputs.dry_run != 'true' }}
    uses: ./.github/workflows/mobile-release.yml
    with:
      source_ref: ${{ needs.create-release.outputs.source_sha }}
      version_name: ${{ needs.create-release.outputs.version }}
      build_number: ${{ github.run_number }}
      release_tag: v${{ needs.create-release.outputs.version }}
      upload_github_release: true
      build_android: true
      build_ios: false
    secrets: inherit

  finalize-release:
    needs: [create-release, build-desktop-electron-windows, build-desktop-electron-linux, package-web, mobile-release]
    if: ${{ !cancelled() && !failure() && needs.create-release.result == 'success' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify final cross-platform release asset inventory
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node - <<'NODE'
          (async () => {
          const { REPOSITORY: repo, VERSION: version, GITHUB_TOKEN: token } = process.env;
          const exact = [
            `openchamber-web-${version}.tgz`,
            `OpenChamber-${version}-win-x64.exe`,
            `OpenChamber-${version}-win-x64.exe.blockmap`,
            'latest.yml',
            `OpenChamber-${version}-linux-x86_64.AppImage`,
            'latest-linux.yml',
          ];
          const response = await fetch(`https://api.github.com/repos/${repo}/releases/tags/v${version}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`Failed to inspect release assets: ${response.status} ${await response.text()}`);
          const release = await response.json();
          const validate = (asset, label) => {
            if (!Number.isSafeInteger(asset.size) || asset.size <= 0) {
              throw new Error(`Release asset ${label} has invalid size ${asset.size}`);
            }
          };
          for (const name of exact) {
            const matches = release.assets.filter((asset) => asset.name === name);
            if (matches.length !== 1) throw new Error(`Expected exactly one ${name} release asset, found ${matches.length}`);
            validate(matches[0], name);
          }
          const androidKinds = ['apk', 'aab'];
          for (const kind of androidKinds) {
            const prefix = `OpenChamber-${version}-`;
            const suffix = `-android.${kind}`;
            const matches = release.assets.filter((asset) => asset.name.startsWith(prefix) && asset.name.endsWith(suffix));
            if (matches.length !== 1) throw new Error(`Expected exactly one Android ${kind} release asset, found ${matches.length}`);
            validate(matches[0], matches[0].name);
          }
          console.log(`Verified ${exact.length + androidKinds.length} cross-platform release assets.`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

