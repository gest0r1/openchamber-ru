name: Integration Linux bundle and install smoke

on:
  push:
    branches:
      - integration/upstream-2026-09-18
    paths:
      - .github/workflows/integration-linux-bundle.yml
      - scripts/install-linux-integration-bundle.sh
      - package.json
      - bun.lock
      - packages/web/**
      - packages/sdk/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Build reproducible SDK/web from lockfile
        run: |
          set -Eeuo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run --cwd packages/sdk build
          bun run build:web
      - name: Package workspace production dependencies, SDK and exact OpenCode
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSET="openchamber-integration-linux-x64-${GITHUB_SHA}.tar.gz"
          MANIFEST="openchamber-integration-linux-x64-${GITHUB_SHA}.json"
          VERSION="$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")"
          WEB_VERSION="$(node -p "require('./packages/web/package.json').dependencies['@opencode-ai/sdk']")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$VERSION" == "$WEB_VERSION" ]]
          stage=bundle/package
          mkdir -p "$stage/packages/web" "$stage/packages/sdk" "$stage/opencode-cli"
          cp package.json bun.lock "$stage/"
          cp -a bun-patches "$stage/"
          for manifest in packages/*/package.json packages/sdk/examples/*/package.json; do
            [[ -f "$manifest" ]] || continue
            mkdir -p "$stage/$(dirname "$manifest")"
            cp "$manifest" "$stage/$manifest"
          done
          cp -a packages/web/server packages/web/bin packages/web/public packages/web/dist "$stage/packages/web/"
          cp -a packages/sdk/dist "$stage/packages/sdk/"
          (
            cd "$stage"
            bun install --production --frozen-lockfile --ignore-scripts
          )
          npm install --prefix "$stage/opencode-cli" --no-save --omit=dev --no-audit --no-fund "opencode-ai@${VERSION}"
          [[ "$("$stage/opencode-cli/node_modules/.bin/opencode" --version)" == "$VERSION" ]]
          (
            cd "$stage"
            node --input-type=module -e "import('@openchamber/sdk').then(() => console.log('SDK import OK'))"
            node packages/web/bin/cli.js --version
          )
          tar -C bundle -czf "$ASSET" package
          SHA256="$(sha256sum "$ASSET" | cut -d ' ' -f1)"
          SOURCE_SHA="$GITHUB_SHA" ASSET="$ASSET" SHA256="$SHA256" OPENCODE_VERSION="$VERSION" MANIFEST="$MANIFEST" node - <<'NODE'
          const fs = require('node:fs');
          const m = {schema_version:2,platform:'linux-x64',source_sha:process.env.SOURCE_SHA,repository:process.env.GITHUB_REPOSITORY,asset:process.env.ASSET,sha256:process.env.SHA256,opencode_version:process.env.OPENCODE_VERSION};
          fs.writeFileSync(process.env.MANIFEST, JSON.stringify(m,null,2)+'\n');
          NODE
          cp scripts/install-linux-integration-bundle.sh install-linux-integration-bundle.sh
          printf 'asset=%s\n' "$ASSET" >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\n' "$MANIFEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-integration-${{ github.sha }}
          path: |
            openchamber-integration-linux-x64-*.tar.gz
            openchamber-integration-linux-x64-*.json
            install-linux-integration-bundle.sh
          if-no-files-found: error
          retention-days: 7

  install-from-github-artifact:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@b14cf4c926f8e2cbf9dc67969cb738c6ffc1035f # v4.3.0
        with:
          name: linux-integration-${{ github.sha }}
          path: downloaded
      - name: Install and re-install solely from downloaded GitHub artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          cd downloaded
          asset="openchamber-integration-linux-x64-${GITHUB_SHA}.tar.gz"
          manifest="openchamber-integration-linux-x64-${GITHUB_SHA}.json"
          prefix="$RUNNER_TEMP/openchamber-clean-install"
          bash ./install-linux-integration-bundle.sh "$asset" "$manifest" "$prefix"
          "$prefix/bin/openchamber" --version
          version="$(node -p "require('./$manifest').opencode_version")"
          test "$("$prefix/bin/opencode" --version)" = "$version"
          test "$(realpath "$prefix/current")" = "$prefix/releases/$GITHUB_SHA"
          bash ./install-linux-integration-bundle.sh "$asset" "$manifest" "$prefix"
          test "$("$prefix/bin/opencode" --version)" = "$version"
          echo "Verified installation, idempotent update, OpenCode $version and SHA $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
