name: OpenChamber Linux x64 distribution

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - upgrade/openchamber-1.24.2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-x64-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  resolve-build-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Resolve reusable verified x64 bundle
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          fingerprint="$(node scripts/linux-bundle-fingerprint.mjs)"
          current_tag="linux-bundle-${SOURCE_SHA}"
          {
            echo "fingerprint=$fingerprint"
            echo "current_tag=$current_tag"
            echo "current_release=false"
            echo "reuse=false"
          } >> "$GITHUB_OUTPUT"

          validate_manifest() {
            node - "$1" "$2" "$3" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedSource, expectedFingerprint] = process.argv.slice(2);
          const m = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (![2, 3].includes(m.schema_version) ||
              m.platform !== 'linux-x64' ||
              m.source_sha !== expectedSource ||
              !/^[a-f0-9]{64}$/.test(String(m.sha256 || '')) ||
              !/^\d+\.\d+\.\d+$/.test(String(m.opencode_version || '')) ||
              !/^openchamber-integration-linux-x64-[a-f0-9]{40}\.tar\.gz$/.test(String(m.asset || ''))) {
            process.exit(1);
          }
          const bundleSource = m.schema_version === 3 ? m.bundle_source_sha : m.source_sha;
          const bundleTag = m.schema_version === 3 ? m.bundle_tag : `linux-bundle-${m.source_sha}`;
          if (!/^[a-f0-9]{40}$/.test(String(bundleSource || '')) ||
              bundleTag !== `linux-bundle-${bundleSource}` ||
              m.asset !== `openchamber-integration-linux-x64-${bundleSource}.tar.gz` ||
              (m.schema_version === 3 && m.bundle_fingerprint !== expectedFingerprint)) {
            process.exit(1);
          }
          process.stdout.write([
            bundleTag,
            bundleSource,
            m.asset,
            m.sha256,
            m.opencode_version,
          ].join('\t'));
          NODE
          }

          asset_exists() {
            local release_tag="$1" asset_name="$2"
            gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets               --jq '.assets[].name' | grep -Fxq "$asset_name"
          }

          if gh release view "$current_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            gh release download "$current_tag" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$tmp"
            metadata="$(validate_manifest "$tmp/manifest.json" "$SOURCE_SHA" "$fingerprint" 2>/dev/null || true)"
            rm -rf "$tmp"
            [[ -n "$metadata" ]] || {
              echo "Existing exact-SHA release $current_tag is invalid; refusing to overwrite immutable release" >&2
              exit 1
            }
            IFS=$'\t' read -r existing_bundle_tag _ existing_asset _ _ <<< "$metadata"
            asset_exists "$existing_bundle_tag" "$existing_asset" || {
              echo "Existing exact-SHA release references missing asset $existing_bundle_tag/$existing_asset" >&2
              exit 1
            }
            echo "current_release=true" >> "$GITHUB_OUTPUT"
            echo "Exact-SHA release already exists: $current_tag"
            exit 0
          fi

          declare -A releases=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && releases["$tag"]=1
          done < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName               --jq '.[].tagName | select(startswith("linux-bundle-"))'
          )

          while IFS= read -r candidate; do
            tag="linux-bundle-$candidate"
            [[ -n "${releases[$tag]:-}" ]] || continue

            candidate_fingerprint="$(node scripts/linux-bundle-fingerprint.mjs --ref "$candidate" 2>/dev/null || true)"
            [[ "$candidate_fingerprint" == "$fingerprint" ]] || continue

            tmp="$(mktemp -d)"
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$tmp" >/dev/null 2>&1; then
              rm -rf "$tmp"
              continue
            fi
            metadata="$(validate_manifest "$tmp/manifest.json" "$candidate" "$candidate_fingerprint" 2>/dev/null || true)"
            rm -rf "$tmp"
            [[ -n "$metadata" ]] || continue

            IFS=$'\t' read -r bundle_tag bundle_source asset sha256 opencode_version <<< "$metadata"
            asset_exists "$bundle_tag" "$asset" || continue

            {
              echo "reuse=true"
              echo "bundle_tag=$bundle_tag"
              echo "bundle_source_sha=$bundle_source"
              echo "asset=$asset"
              echo "sha256=$sha256"
              echo "opencode_version=$opencode_version"
            } >> "$GITHUB_OUTPUT"
            echo "Reusing verified x64 bundle $bundle_tag for $SOURCE_SHA"
            exit 0
          done < <(git rev-list --max-count=100 "${SOURCE_SHA}^")

          echo "No reusable verified x64 bundle matches fingerprint $fingerprint; full build required"

      - name: Write exact-SHA reference manifest
        if: steps.resolve.outputs.current_release != 'true' && steps.resolve.outputs.reuse == 'true'
        env:
          BUNDLE_FINGERPRINT: ${{ steps.resolve.outputs.fingerprint }}
          BUNDLE_TAG: ${{ steps.resolve.outputs.bundle_tag }}
          BUNDLE_SOURCE_SHA: ${{ steps.resolve.outputs.bundle_source_sha }}
          ASSET: ${{ steps.resolve.outputs.asset }}
          SHA256: ${{ steps.resolve.outputs.sha256 }}
          OPENCODE_VERSION: ${{ steps.resolve.outputs.opencode_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const m = {
            schema_version: 3,
            platform: 'linux-x64',
            source_sha: process.env.SOURCE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            bundle_source_sha: process.env.BUNDLE_SOURCE_SHA,
            bundle_tag: process.env.BUNDLE_TAG,
            asset: process.env.ASSET,
            sha256: process.env.SHA256,
            opencode_version: process.env.OPENCODE_VERSION,
            bundle_fingerprint: process.env.BUNDLE_FINGERPRINT,
          };
          fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          NODE
          cp scripts/install-linux-integration-bundle.sh install-linux-integration-bundle.sh

      - name: Publish exact-SHA reference release
        if: github.event_name != 'pull_request' && steps.resolve.outputs.current_release != 'true' && steps.resolve.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="linux-bundle-${SOURCE_SHA}"
          gh release create "$tag" manifest.json install-linux-integration-bundle.sh             --target "$SOURCE_SHA"             --prerelease             --title "OpenChamber Linux x64 ${SOURCE_SHA:0:12}"             --notes "Exact-main-SHA manifest reusing verified bundle ${{ steps.resolve.outputs.bundle_tag }}."             --repo "$GITHUB_REPOSITORY"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.resolve.outputs.current_release != 'true' && steps.resolve.outputs.reuse != 'true'
        with:
          bun-version: '1.4.2'

      - name: Build reproducible SDK/web and pinned OpenCode
        if: steps.resolve.outputs.current_release != 'true' && steps.resolve.outputs.reuse != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run --cwd packages/sdk build
          bun run build:web
          root="$(node -p 'require("./package.json").dependencies["@opencode-ai/sdk"]')"
          web="$(node -p 'require("./packages/web/package.json").dependencies["@opencode-ai/sdk"]')"
          [[ "$root" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$root" == "$web" ]]
          echo "OPENCODE_VERSION=$root" >> "$GITHUB_ENV"

      - name: Assemble dependency-complete x64 distribution
        if: steps.resolve.outputs.current_release != 'true' && steps.resolve.outputs.reuse != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=bundle/package
          mkdir -p "$stage/packages/web" "$stage/packages/sdk" "$stage/opencode-cli"
          cp package.json bun.lock "$stage/"
          cp -a bun-patches "$stage/"
          for manifest in packages/*/package.json packages/sdk/examples/*/package.json; do
            [[ -f "$manifest" ]] || continue
            mkdir -p "$stage/$(dirname "$manifest")"
            cp "$manifest" "$stage/$manifest"
          done
          cp -a packages/web/server packages/web/bin packages/web/public packages/web/dist "$stage/packages/web/"
          cp -a packages/sdk/dist "$stage/packages/sdk/"
          cd "$stage"
          bun install --production --frozen-lockfile --ignore-scripts
          cd "$GITHUB_WORKSPACE"
          npm install --prefix "$stage/opencode-cli" --no-save --omit=dev --no-audit --no-fund "opencode-ai@${OPENCODE_VERSION}"
          test "$("$stage/opencode-cli/node_modules/.bin/opencode" --version)" = "$OPENCODE_VERSION"
          isolated="$RUNNER_TEMP/openchamber-stage-check"
          mv "$stage" "$isolated"
          cd "$isolated/packages/web"
          node --input-type=module -e "import('@openchamber/sdk').then(() => console.log('SDK OK'))"
          node bin/cli.js --version
          cd "$GITHUB_WORKSPACE"
          mv "$isolated" "$stage"

      - name: Archive and write x64 manifest
        if: steps.resolve.outputs.current_release != 'true' && steps.resolve.outputs.reuse != 'true'
        env:
          BUNDLE_FINGERPRINT: ${{ steps.resolve.outputs.fingerprint }}
        shell: bash
        run: |
          set -Eeuo pipefail
          asset="openchamber-integration-linux-x64-${SOURCE_SHA}.tar.gz"
          tar -C bundle -czf "$asset" package
          hash="$(sha256sum "$asset" | awk '{print $1}')"
          SOURCE_SHA="$SOURCE_SHA" ASSET="$asset" SHA256="$hash" OPENCODE_VERSION="$OPENCODE_VERSION" BUNDLE_FINGERPRINT="$BUNDLE_FINGERPRINT" node - <<'NODE'
          const fs = require('node:fs');
          const tag = `linux-bundle-${process.env.SOURCE_SHA}`;
          const m = {
            schema_version: 3,
            platform: 'linux-x64',
            source_sha: process.env.SOURCE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            bundle_source_sha: process.env.SOURCE_SHA,
            bundle_tag: tag,
            asset: process.env.ASSET,
            sha256: process.env.SHA256,
            opencode_version: process.env.OPENCODE_VERSION,
            bundle_fingerprint: process.env.BUNDLE_FINGERPRINT,
          };
          fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          NODE
          cp scripts/install-linux-integration-bundle.sh install-linux-integration-bundle.sh

      - name: Verify clean install and reinstall
        if: steps.resolve.outputs.current_release != 'true' && steps.resolve.outputs.reuse != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          asset="openchamber-integration-linux-x64-${SOURCE_SHA}.tar.gz"
          prefix="$RUNNER_TEMP/openchamber-clean-install"
          bash ./install-linux-integration-bundle.sh "$asset" manifest.json "$prefix"
          "$prefix/bin/openchamber" --version
          version="$(node -p "require('./manifest.json').opencode_version")"
          test "$("$prefix/bin/opencode" --version)" = "$version"
          test "$(realpath "$prefix/current")" = "$prefix/releases/$SOURCE_SHA"
          bash ./install-linux-integration-bundle.sh "$asset" manifest.json "$prefix"
          test "$("$prefix/bin/opencode" --version)" = "$version"

      - name: Publish verified immutable x64 bundle
        if: github.event_name != 'pull_request' && steps.resolve.outputs.current_release != 'true' && steps.resolve.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          asset="openchamber-integration-linux-x64-${SOURCE_SHA}.tar.gz"
          tag="linux-bundle-${SOURCE_SHA}"
          gh release create "$tag" manifest.json "$asset" install-linux-integration-bundle.sh             --target "$SOURCE_SHA"             --prerelease             --title "OpenChamber Linux x64 ${SOURCE_SHA:0:12}"             --notes "Verified x64 runtime bundle. No Actions artifact is retained."             --repo "$GITHUB_REPOSITORY"

      - name: Verify published exact-SHA manifest
        if: github.event_name != 'pull_request' && steps.resolve.outputs.current_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_FINGERPRINT: ${{ steps.resolve.outputs.fingerprint }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tag="linux-bundle-${SOURCE_SHA}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$tmp"
          metadata="$(node - "$tmp/manifest.json" "$SOURCE_SHA" "$BUNDLE_FINGERPRINT" <<'NODE'
          const fs = require('node:fs');
          const [file, expected, expectedFingerprint] = process.argv.slice(2);
          const m = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (m.schema_version !== 3 ||
              m.platform !== 'linux-x64' ||
              m.source_sha !== expected ||
              !/^[a-f0-9]{40}$/.test(String(m.bundle_source_sha || '')) ||
              m.bundle_tag !== `linux-bundle-${m.bundle_source_sha}` ||
              m.asset !== `openchamber-integration-linux-x64-${m.bundle_source_sha}.tar.gz` ||
              !/^[a-f0-9]{64}$/.test(String(m.sha256 || '')) ||
              m.bundle_fingerprint !== expectedFingerprint) {
            process.exit(1);
          }
          process.stdout.write(`${m.bundle_tag}\t${m.asset}`);
          NODE
          )"
          IFS=$'\t' read -r bundle_tag asset <<< "$metadata"
          gh release view "$bundle_tag" --repo "$GITHUB_REPOSITORY" --json assets             --jq '.assets[].name' | grep -Fxq "$asset"
