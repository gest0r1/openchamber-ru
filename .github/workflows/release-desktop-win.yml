# Windows-only desktop release build for gest0r1/openchamber-ru.
# Produces an unsigned interactive NSIS installer.

name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.24.2). Leave empty to read from package.json.'
        required: false
        type: string
      retention_days:
        description: Artifact retention days
        required: false
        default: '7'
        type: choice
        options: ['1', '3', '7', '14']
  push:
    branches:
      - 'release/windows-*'

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read versions
        id: versions
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION=$(node -p "require('./package.json').version")
          OPENCODE=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          WEB_OPENCODE=$(node -p "require('./packages/web/package.json').dependencies['@opencode-ai/sdk']")
          test "$OPENCODE" = "$WEB_OPENCODE"
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then TAG="v${VERSION}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "opencode=$OPENCODE" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-x64-${{ steps.versions.outputs.opencode }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-x64-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: x64
        run: node ./scripts/rebuild-native.mjs

      - name: Package Windows app
        working-directory: packages/electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node ./scripts/package.mjs --win --x64 --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-ru-windows-x64
          path: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days || '7') }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.versions.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenChamber ${{ steps.versions.outputs.tag }} (Windows RU)
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
          body: |
            ## OpenChamber ${{ steps.versions.outputs.tag }} - Windows RU

            Unsigned NSIS installer. SmartScreen warning is expected because this fork has no code-signing certificate.

            Fork delta on upstream OpenChamber v1.24.2:
            - Russian UI locale with English fallback for untranslated keys.
            - Fork updater/release feed points to `gest0r1/openchamber-ru`.
            - Windows installer uses interactive NSIS setup and creates shortcuts.
            - User agents use the upstream OpenCode configuration path under `~/.config/opencode/agents`.
            - Bundled OpenCode CLI is pinned and verified during packaging.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
