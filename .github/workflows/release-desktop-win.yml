# Windows-only desktop release build for gest0r1/openchamber-ru fork
# Produces an unsigned NSIS installer (SmartScreen warning expected — no code signing cert available).
# Normal use: workflow_dispatch. A narrow release-trigger path is also supported for automated release preparation.

name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.22.0). Leave empty to read from package.json.'
        required: false
        type: string
      retention_days:
        description: Artifact retention days
        required: false
        default: '7'
        type: choice
        options:
          - '1'
          - '3'
          - '7'
          - '14'
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger'

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64

    steps:
      - name: Checkout fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read package version
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        run: node ./scripts/rebuild-native.mjs

      - name: Package Windows app
        working-directory: packages/electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-ru-windows-${{ matrix.arch }}
          path: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days || '7') }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenChamber ${{ steps.pkg.outputs.tag }} (Windows)
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
          body: |
            ## OpenChamber ${{ steps.pkg.outputs.tag }} — Windows

            Unsigned NSIS installer. SmartScreen warning expected (no code signing cert).

            ### Fork changes
            - Russian interface preserved on top of upstream v1.22.0.
            - Fork updater/release feed points to gest0r1/openchamber-ru.
            - Scheduled-tasks dependency and fork-specific agent/runtime fixes preserved.
            - Bundled OpenCode CLI is prepared and verified during packaging.

            ### Upstream changes
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the v1.22.0 changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
