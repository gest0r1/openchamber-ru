# Windows-only desktop release build for gest0r1/openchamber-ru fork
# Triggered manually via workflow_dispatch. Produces unsigned NSIS installer
# (SmartScreen warning expected — no code signing cert available).
# Artifacts uploaded to GitHub Actions storage (7-day retention).
# No auto-publish — artifacts are manual-only and workflow token is read-only.

name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: Artifact retention days
        required: false
        default: '7'
        type: choice
        options:
          - '1'
          - '3'
          - '7'
          - '14'

permissions:
  contents: read

jobs:
  build-win:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64

    steps:
      - name: Checkout fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        run: node ./scripts/rebuild-native.mjs

      - name: Package Windows app
        working-directory: packages/electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-ru-windows-${{ matrix.arch }}
          path: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days || 7) }}
