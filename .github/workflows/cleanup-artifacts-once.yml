name: Cleanup Actions artifacts once

on:
  push:
    branches:
      - cleanup/actions-artifacts-once

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "repos/$GH_REPO/actions/artifacts/$artifact_id"
          done
