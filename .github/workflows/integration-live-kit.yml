name: OpenChamber live Linux deployment kit
on:
  push:
    branches: [integration/upstream-2026-09-18]
    paths:
      - scripts/upgrade-working-from-bundle.sh
      - .github/workflows/integration-live-kit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  live-kit:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Fetch already verified OpenChamber+OpenCode binary distribution exclusively from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sha=567945128aa4b7ecf77cbdeec9e76ddf3a041741
          gh run download 35432229576 -R "$GITHUB_REPOSITORY" -n "linux-integration-$sha" -D distribution
          cp scripts/upgrade-working-from-bundle.sh distribution/upgrade-working-from-bundle.sh
          bash -n distribution/install-linux-integration-bundle.sh distribution/upgrade-working-from-bundle.sh
          node - distribution "$sha" <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const path=require('node:path');
          const [dir,sha]=process.argv.slice(2);
          const m=JSON.parse(fs.readFileSync(path.join(dir,`openchamber-integration-linux-x64-${sha}.json`)));
          if(m.source_sha!==sha || m.opencode_version!=='1.18.31') throw Error('Unexpected binary provenance');
          const file=path.join(dir,m.asset);
          const digest=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          if(digest!==m.sha256) throw Error('Downloaded OpenChamber archive checksum mismatch');
          console.log('Verified immutable GitHub artifact source='+sha+' opencode='+m.opencode_version);
          NODE
      - name: Smoke test distribution installation entirely outside source checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          sha=567945128aa4b7ecf77cbdeec9e76ddf3a041741
          cd distribution
          asset="openchamber-integration-linux-x64-$sha.tar.gz"
          manifest="openchamber-integration-linux-x64-$sha.json"
          prefix="$RUNNER_TEMP/live-kit-runtime"
          bash install-linux-integration-bundle.sh "$asset" "$manifest" "$prefix"
          bash install-linux-integration-bundle.sh "$asset" "$manifest" "$prefix"
          test "$("$prefix/bin/openchamber" --version)" = '1.24.1'
          test "$("$prefix/bin/opencode" --version)" = '1.18.31'
          test "$(realpath "$prefix/current")" = "$prefix/releases/$sha"
          grep -Fq 'serve --foreground --host $host --port $port' upgrade-working-from-bundle.sh
          grep -Fq 'systemctl --user restart openchamber.service' upgrade-working-from-bundle.sh
          grep -Fq 'OPENCHAMBER_UI_PASSWORD' upgrade-working-from-bundle.sh
          echo 'Verified binary distribution, reinstall, versions and live-upgrade script syntax/contract.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-integration-${{ github.sha }}
          path: distribution/
          if-no-files-found: error
          retention-days: 7
