name: restore-fork-runtime-patches

on:
  push:
    branches:
      - sync-upstream-2026-09-11

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: sync-upstream-2026-09-11
          fetch-depth: 1

      - name: Restore fork-specific runtime behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mobile = Path('packages/ui/src/apps/MobileApp.tsx')
          text = mobile.read_text(encoding='utf-8')
          old = "  'snippets',\n  'behavior',\n"
          new = "  'snippets',\n  'projects',\n  'remote-instances',\n  'behavior',\n"
          if old not in text:
              raise SystemExit('Mobile settings insertion point changed')
          text = text.replace(old, new, 1)
          old = "  'voice',\n  'integrations',\n"
          new = "  'voice',\n  'tunnel',\n  'integrations',\n"
          if old not in text:
              raise SystemExit('Mobile tunnel insertion point changed')
          mobile.write_text(text.replace(old, new, 1), encoding='utf-8')

          pkg_path = Path('packages/electron/package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          nsis = pkg['build']['nsis']
          nsis['oneClick'] = False
          nsis['perMachine'] = False
          nsis['allowToChangeInstallationDirectory'] = True
          nsis['createDesktopShortcut'] = True
          nsis['createStartMenuShortcut'] = True
          nsis['shortcutName'] = 'OpenChamber'
          pkg['build']['publish'] = {
              'provider': 'github',
              'owner': 'gest0r1',
              'repo': 'openchamber-ru',
          }
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          main = Path('packages/electron/main.mjs')
          text = main.read_text(encoding='utf-8')
          replacements = {
              "https://github.com/openchamber/openchamber/issues/new?template=bug_report.yml":
                  "https://github.com/gest0r1/openchamber-ru/issues/new?template=bug_report.yml",
              "https://github.com/openchamber/openchamber/issues/new?template=feature_request.yml":
                  "https://github.com/gest0r1/openchamber-ru/issues/new?template=feature_request.yml",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one URL to replace: {old}')
              text = text.replace(old, new)
          main.write_text(text, encoding='utf-8')

          diag = Path('sync-test-failure.log')
          if diag.exists():
              diag.unlink()
          PY

      - name: Verify restored fork invariants
        run: |
          grep -F "'projects'" packages/ui/src/apps/MobileApp.tsx
          grep -F "'remote-instances'" packages/ui/src/apps/MobileApp.tsx
          grep -F "'tunnel'" packages/ui/src/apps/MobileApp.tsx
          grep -F '"owner": "gest0r1"' packages/electron/package.json
          grep -F '"repo": "openchamber-ru"' packages/electron/package.json
          grep -F '"oneClick": false' packages/electron/package.json
          grep -F 'github.com/gest0r1/openchamber-ru/issues/new?template=bug_report.yml' packages/electron/main.mjs

      - name: Commit restored patches and remove this one-shot workflow
        run: |
          rm -f .github/workflows/restore-fork-runtime-patches.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(fork): restore release and mobile runtime patches'
          git push origin HEAD:sync-upstream-2026-09-11
