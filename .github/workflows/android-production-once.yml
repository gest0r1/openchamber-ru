name: Android Production One-off

on:
  push:
    branches:
      - ci/android-production-2.1.0-20261005
    paths:
      - .github/workflows/android-production-once.yml

permissions:
  contents: read

jobs:
  android-release:
    name: Android production signed release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openchamber-release.keystore"

      - name: Verify Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || { echo "ANDROID_KEYSTORE_PASSWORD secret is required" >&2; exit 1; }
          [[ -n "$ANDROID_KEY_ALIAS" ]] || { echo "ANDROID_KEY_ALIAS secret is required" >&2; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/openchamber-release.keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed Android release
        env:
          OPENCHAMBER_ANDROID_VERSION_CODE: ${{ github.run_number }}
          OPENCHAMBER_ANDROID_VERSION_NAME: '2.1.0'
          OPENCHAMBER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/openchamber-release.keystore
          OPENCHAMBER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENCHAMBER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENCHAMBER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bun run mobile:sync
          ./packages/mobile/android/gradlew -p packages/mobile/android bundleRelease assembleRelease

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: openchamber-ru-2.1.0-android-production
          path: |
            packages/mobile/android/app/build/outputs/bundle/release/*.aab
            packages/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
