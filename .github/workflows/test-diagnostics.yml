name: test-diagnostics

on:
  push:
    branches:
      - sync-upstream-2026-09-11

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: sync-upstream-2026-09-11
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Capture tests
        shell: bash
        run: |
          set +e
          bun run test > /tmp/sync-test.log 2>&1
          status=$?
          {
            echo "exit_code=$status"
            echo "--- last 1200 lines ---"
            tail -n 1200 /tmp/sync-test.log
          } > sync-test-failure.log
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sync-test-failure.log
          git commit -m 'ci: record sync test diagnostics'
          git push origin HEAD:sync-upstream-2026-09-11
