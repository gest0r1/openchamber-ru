name: Migrate integration bundle into standard release
on:
  push:
    branches: [integration/upstream-2026-09-18]
    paths: [.github/workflows/.integrate-standard-release.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Consolidate bundle publication and remove redundant live kit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/integration-linux-bundle.yml')
          s=p.read_text()
          original='permissions:\n  contents: read\n'
          assert s.count(original)==1
          s=s.replace(original, 'permissions:\n  contents: write\n')
          assert 'name: Publish exact-SHA GitHub Release for standard installer' not in s
          s+='''      - name: Publish exact-SHA GitHub Release for standard installer
                env:
                  GH_TOKEN: ${{ github.token }}
                shell: bash
                run: |
                  set -Eeuo pipefail
                  cd downloaded
                  manifest="openchamber-integration-linux-x64-${GITHUB_SHA}.json"
                  archive="openchamber-integration-linux-x64-${GITHUB_SHA}.tar.gz"
                  cp "$manifest" manifest.json
                  tag="linux-bundle-${GITHUB_SHA}"
                  if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    gh release upload "$tag" manifest.json "$archive" install-linux-integration-bundle.sh --clobber --repo "$GITHUB_REPOSITORY"
                  else
                    gh release create "$tag" manifest.json "$archive" install-linux-integration-bundle.sh --target "$GITHUB_SHA" --prerelease --title "OpenChamber Linux ${GITHUB_SHA:0:12}" --notes "Exact-commit GitHub-built OpenChamber and pinned OpenCode distribution for the standard installer." --repo "$GITHUB_REPOSITORY"
                  fi
                  tmp="$(mktemp -d)"
                  trap 'rm -rf "$tmp"' EXIT
                  gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$tmp"
                  node - "$tmp/manifest.json" "$GITHUB_SHA" <<'NODE'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(m.source_sha!==process.argv[3] || m.schema_version!==2 || m.platform!=='linux-x64' || !/^[a-f0-9]{64}$/.test(m.sha256))process.exit(1);
          NODE
                  echo "Published and verified $tag" >> "$GITHUB_STEP_SUMMARY"
          '''
          # YAML step env/shell/run should be at the same 6-space indentation as other steps.
          s=s.replace('                env:\n                  GH_TOKEN:', '        env:\n          GH_TOKEN:')
          s=s.replace('                shell: bash\n                run: |', '        shell: bash\n        run: |')
          # Restore the run block to the expected indentation of 10 spaces.
          pos=s.index('      - name: Publish exact-SHA GitHub Release for standard installer')
          head,tail=s[:pos],s[pos:]
          tail_lines=tail.splitlines(keepends=True)
          in_run=False
          fixed=[]
          for line in tail_lines:
            if line=='        run: |\n':
              in_run=True; fixed.append(line); continue
            if in_run and line.startswith('                  '):
              fixed.append(line[8:]); continue
            if in_run and line.startswith('          const fs='):
              fixed.append(line); continue
            if in_run and line.startswith('          NODE'):
              fixed.append(line); continue
            fixed.append(line)
          s=head+''.join(fixed)
          p.write_text(s)
          PY
          git rm .github/workflows/integration-live-kit.yml scripts/upgrade-working-from-bundle.sh .github/workflows/.integrate-standard-release.yml
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/integration-linux-bundle.yml').read_text()
          assert 'linux-bundle-${GITHUB_SHA}' in text
          assert 'contents: write' in text
          assert 'name: Publish exact-SHA GitHub Release for standard installer' in text
          print(text[text.index('      - name: Publish exact-SHA GitHub Release for standard installer'):])
          PY
      - name: Commit and push integration only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/integration-linux-bundle.yml
          git commit -m 'build: publish standard exact-SHA OpenChamber release and delete one-off live kit'
          git push origin HEAD:refs/heads/integration/upstream-2026-09-18
