name: Apply full Markdown export patch

on:
  push:
    branches:
      - feature/full-markdown-export

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-markdown-export
          fetch-depth: 0

      - name: Patch session menu
        run: python scripts/patch-full-markdown-export.py

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused tests
        run: bun test packages/ui/src/lib/exportSession.test.ts packages/ui/src/lib/fullSessionExport.test.ts

      - name: Type-check UI
        run: bun --cwd packages/ui run type-check

      - name: Commit branch patch
        run: |
          rm .github/workflows/patch-full-markdown-export.yml scripts/patch-full-markdown-export.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/components/session/sidebar/sessions/SessionNodeItem.tsx .github/workflows/patch-full-markdown-export.yml scripts/patch-full-markdown-export.py
          git commit -m "feat(ui): wire full Markdown session export"
          git push origin HEAD:feature/full-markdown-export
