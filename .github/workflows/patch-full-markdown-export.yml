name: Apply full Markdown export patch

on:
  push:
    branches:
      - feature/full-markdown-export
    paths:
      - .github/workflows/patch-full-markdown-export.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-markdown-export
          fetch-depth: 0

      - name: Patch session menu
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('packages/ui/src/components/session/sidebar/sessions/SessionNodeItem.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import type { ChildSessionExport } from '@/lib/exportSession';\n",
              "import type { ChildSessionExport } from '@/lib/exportSession';\nimport { collectFullSessionExport, formatFullSessionAsMarkdown } from '@/lib/fullSessionExport';\n",
          )

          marker = """  const handleExportSession = React.useCallback(async () => {
            if (node.children.length > 0) {
              setExportIncludeSubtasks(true);
              setExportDialogOpen(true);
              return;
            }
            await doExportSession(false);
          }, [doExportSession, node.children.length]);

"""
          full_handler = marker + """  const handleFullMarkdownExport = React.useCallback(async () => {
            if (!sessionDirectory) {
              toast.error(t('sessions.sidebar.session.export.nothingToExport'));
              return;
            }

            const records = await loadExportRecords({ directory: sessionDirectory, sessionID: session.id }).catch(() => null);
            if (!records) {
              toast.error(t('sessions.sidebar.session.export.failedLoadHistory'));
              return;
            }
            if (records.length === 0) {
              toast.error(t('sessions.sidebar.session.export.nothingToExport'));
              return;
            }

            const fullExport = await collectFullSessionExport(
              resolvedSession,
              records,
              async (childSession) => {
                const childDirectory = normalizePath(childSession.directory);
                if (!childDirectory) throw new Error('Session directory is required for export');
                return loadExportRecords({ directory: childDirectory, sessionID: childSession.id });
              },
            );
            const markdown = formatFullSessionAsMarkdown(fullExport);
            const filename = buildExportFilename(`${resolvedSession.title || 'session'}-full`);
            const savedPath = await saveAsMarkdownDesktop(markdown, filename);

            if (savedPath) {
              toast.success(t('sessions.sidebar.session.export.success'), {
                action: {
                  label: t(getExportRevealLabelKey()),
                  onClick: () => {
                    void revealExportedMarkdown(savedPath).then((revealed) => {
                      if (!revealed) toast.error(t('sessions.sidebar.session.export.failedRevealPath'));
                    });
                  },
                },
              });
            } else {
              downloadAsMarkdown(markdown, filename);
              toast.success(t('sessions.sidebar.session.export.success'));
            }

            if (fullExport.incompleteCount > 0) {
              console.warn(`[session-export] full Markdown export contains ${fullExport.incompleteCount} incomplete branch(es)`);
            }
          }, [loadExportRecords, resolvedSession, session.id, sessionDirectory, t]);

"""
          replace_once(marker, full_handler)

          menu = """      <SessionMenuItemHint hint={t('sessions.sidebar.session.menuHint.exportMarkdown')}>
          <Item onClick={() => { void handleExportSession(); }} className=\"[&>svg]:me-1\">
            <Icon name=\"download\" className=\"me-1 h-4 w-4\" />
            {t('sessions.sidebar.session.menu.exportMarkdown')}
          </Item>
          </SessionMenuItemHint>
"""
          menu_with_full = menu + """      <SessionMenuItemHint hint={t('sessions.sidebar.session.menuHint.exportMarkdown')}>
          <Item onClick={() => { void handleFullMarkdownExport(); }} className=\"[&>svg]:me-1\">
            <Icon name=\"download\" className=\"me-1 h-4 w-4\" />
            Full Markdown export
          </Item>
          </SessionMenuItemHint>
"""
          replace_once(menu, menu_with_full)

          path.write_text(text)

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused tests
        run: bun test packages/ui/src/lib/exportSession.test.ts packages/ui/src/lib/fullSessionExport.test.ts

      - name: Type-check UI
        run: bun --cwd packages/ui run type-check

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/patch-full-markdown-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/components/session/sidebar/sessions/SessionNodeItem.tsx .github/workflows/patch-full-markdown-export.yml
          git commit -m "feat(ui): wire full Markdown session export"
          git push origin HEAD:feature/full-markdown-export
