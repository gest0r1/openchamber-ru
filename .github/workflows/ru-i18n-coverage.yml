name: Russian i18n coverage

on:
  push:
    branches:
      - main
    paths:
      - 'packages/ui/src/lib/i18n/**'
      - 'packages/ui/src/lib/linkedIssues.ts'
      - 'packages/ui/src/lib/linkedIssues.test.ts'
      - 'packages/ui/src/components/chat/ChatInput.tsx'
      - 'packages/ui/src/components/sections/integrations/catalogExtensions.ts'
      - 'packages/ui/src/components/sections/integrations/catalogExtensions.test.ts'
      - 'packages/ui/src/components/sections/integrations/CatalogExtensionsSection.tsx'
      - 'packages/electron/updater-feed.mjs'
      - 'packages/electron/updater-feed.test.mjs'
      - 'packages/electron/scripts/finalize-latest-yml.mjs'
      - 'packages/electron/scripts/finalize-latest-yml.test.mjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/mobile-release.yml'
      - 'scripts/check-fork-release-policy.mjs'
      - '.github/workflows/ru-i18n-coverage.yml'
  pull_request:
    paths:
      - 'packages/ui/src/lib/i18n/**'
      - 'packages/ui/src/lib/linkedIssues.ts'
      - 'packages/ui/src/lib/linkedIssues.test.ts'
      - 'packages/ui/src/components/chat/ChatInput.tsx'
      - 'packages/ui/src/components/sections/integrations/catalogExtensions.ts'
      - 'packages/ui/src/components/sections/integrations/catalogExtensions.test.ts'
      - 'packages/ui/src/components/sections/integrations/CatalogExtensionsSection.tsx'
      - 'packages/electron/updater-feed.mjs'
      - 'packages/electron/updater-feed.test.mjs'
      - 'packages/electron/scripts/finalize-latest-yml.mjs'
      - 'packages/electron/scripts/finalize-latest-yml.test.mjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/mobile-release.yml'
      - 'scripts/check-fork-release-policy.mjs'
      - '.github/workflows/ru-i18n-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  russian-i18n-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # linkedIssues resolves repository URLs through the shared tracked-items model,
      # which imports zod; the contract tests need the workspace dependencies.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Russian dictionary integration and full coverage
        run: |
          bun test \
            packages/ui/src/lib/i18n/messages.test.ts \
            packages/ui/src/lib/i18n/ru-coverage.test.ts \
            packages/ui/src/lib/i18n/messages/

      - name: Check linked GitHub Issue and extension catalog contracts
        run: |
          bun test \
            packages/ui/src/lib/linkedIssues.test.ts \
            packages/ui/src/components/sections/integrations/catalogExtensions.test.ts

      - name: Check fork updater and release manifest contracts
        run: |
          node --test \
            packages/electron/updater-feed.test.mjs \
            packages/electron/scripts/finalize-latest-yml.test.mjs
          node scripts/check-fork-release-policy.mjs
          node --test scripts/release-workflow-contract.test.mjs
