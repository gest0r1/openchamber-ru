name: Russian i18n coverage

on:
  push:
    paths:
      - 'packages/ui/src/lib/i18n/**'
      - '.github/workflows/ru-i18n-coverage.yml'
  pull_request:
    paths:
      - 'packages/ui/src/lib/i18n/**'
      - '.github/workflows/ru-i18n-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  russian-i18n-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Check complete Russian dictionary coverage
        run: bun test packages/ui/src/lib/i18n/messages.test.ts
