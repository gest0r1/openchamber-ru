name: Publish Linux web bundle

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/publish-linux-web-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-web-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      ASSET: openchamber-web-linux-x64-${{ github.sha }}.tar.gz
      MANIFEST: openchamber-web-linux-x64-${{ github.sha }}.json
      TAG: linux-web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/web/package.json

      - name: Install build dependencies without Electron
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build web distribution
        run: bun run build:web

      - name: Create self-contained runtime bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bundle/package
          cp -a packages/web/package.json packages/web/server packages/web/bin packages/web/public packages/web/dist bundle/package/
          (
            cd bundle/package
            bun install --production
          )
          tar -C bundle -czf "$ASSET" package
          sha256sum "$ASSET" | awk '{print $1}' > "$ASSET.sha256"

      - name: Create immutable manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const asset = process.env.ASSET;
          const manifest = {
            schema_version: 1,
            platform: 'linux-x64',
            source_sha: process.env.SOURCE_SHA,
            repository: process.env.REPOSITORY,
            asset,
            sha256: fs.readFileSync(`${asset}.sha256`, 'utf8').trim(),
          };
          fs.writeFileSync(process.env.MANIFEST, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish bundle to the fork release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Linux web bundles" --notes "Automated immutable web/CLI bundles for server installation." --prerelease
          gh release upload "$TAG" "$ASSET" "$MANIFEST" --clobber
