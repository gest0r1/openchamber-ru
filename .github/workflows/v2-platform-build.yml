name: OpenChamber V2 platform build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows x64 installer artifact
        required: false
        default: true
        type: boolean
      build_android:
        description: Build unsigned/debug Android APK artifact
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: v2-platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 installer
    if: inputs.build_windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve bundled OpenCode version
        id: opencode
        shell: bash
        run: |
          version="$(node -p "require('./packages/electron/package.json').opencodeCli.version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-x64-${{ steps.opencode.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-x64-

      - name: Build Windows package
        working-directory: packages/electron
        shell: bash
        run: |
          set -Eeuo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run bundle:main
          ELECTRON_BUILDER_ARCH=x64 node ./scripts/rebuild-native.mjs
          node ./scripts/package.mjs --win --x64 --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-v2-windows-x64
          path: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
          if-no-files-found: error
          retention-days: 3

  android-debug:
    name: Android test APK
    if: inputs.build_android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync mobile app and build debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          bun run mobile:sync
          ./packages/mobile/android/gradlew -p packages/mobile/android assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-v2-android-debug
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
