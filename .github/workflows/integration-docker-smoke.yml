name: Integration Docker delivery smoke

on:
  push:
    branches:
      - integration/upstream-2026-09-18
    paths:
      - Dockerfile
      - package.json
      - bun.lock
      - packages/web/package.json
      - packages/sdk/package.json
      - .github/workflows/integration-docker-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Verify pinned upstream is included
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 01af9bb1bf99eb7647c5366d7675195f319f81c8 HEAD
      - name: Build image from this exact checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --tag "openchamber-integration:${GITHUB_SHA}" .
      - name: Verify delivered image SDK versions
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(docker run --rm --entrypoint node "openchamber-integration:${GITHUB_SHA}" -p 'require("./package.json").dependencies["@opencode-ai/sdk"]')"
          web="$(docker run --rm --entrypoint node "openchamber-integration:${GITHUB_SHA}" -p 'require("./packages/web/package.json").dependencies["@opencode-ai/sdk"]')"
          if [[ "$root" != "$web" || ! "$root" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::SDK mismatch in image: root=$root web=$web"
            exit 1
          fi
          echo "Image SDK version: $root" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify delivered image OpenCode CLI matches SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(node -p 'require("./package.json").dependencies["@opencode-ai/sdk"]')"
          installed="$(docker run --rm --entrypoint opencode "openchamber-integration:${GITHUB_SHA}" --version)"
          if [[ "$installed" != "$expected" ]]; then
            echo "::error::OpenCode mismatch in image: expected=$expected installed=$installed"
            exit 1
          fi
      - name: Verify @openchamber/sdk imports from delivered image
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! docker run --rm --entrypoint node "openchamber-integration:${GITHUB_SHA}" --input-type=module -e 'import("@openchamber/sdk").then(() => console.log("SDK imported"))'; then
            echo '::error::@openchamber/sdk does not import from shipped Docker image'
            exit 1
          fi
      - name: Verify server and web assets exist in delivered image
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! docker run --rm --entrypoint sh "openchamber-integration:${GITHUB_SHA}" -ec 'test -f packages/web/server/index.js && test -d packages/web/dist'; then
            echo '::error::Server or web assets missing from Docker image'
            exit 1
          fi
          echo "Docker smoke complete: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
