name: Integration Windows desktop delivery smoke

on:
  push:
    branches:
      - integration/upstream-2026-09-18
    paths:
      - .github/workflows/integration-windows-desktop-smoke.yml
      - packages/electron/**
      - packages/web/**
      - packages/sdk/**
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Validate exact SDK versions
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const root = require('./package.json');
          const web = require('./packages/web/package.json');
          const sdk = root.dependencies['@opencode-ai/sdk'];
          if (!/^\d+\.\d+\.\d+$/.test(sdk) || web.dependencies['@opencode-ai/sdk'] !== sdk) {
            throw new Error(`SDK mismatch: root=${sdk} web=${web.dependencies['@opencode-ai/sdk']}`);
          }
          console.log(`OpenCode CLI target: ${sdk}`);
          NODE
      - name: Install dependencies from frozen lockfile
        run: bun install --frozen-lockfile
      - name: Build web resources and bundled extensions
        working-directory: packages/electron
        run: bun run build:web-assets
      - name: Download exact OpenCode CLI and verify version
        working-directory: packages/electron
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
      - name: Bundle main and rebuild native modules
        working-directory: packages/electron
        run: |
          bun run bundle:main
          node ./scripts/rebuild-native.mjs
      - name: Package unsigned installer without publishing a release
        working-directory: packages/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node ./scripts/package.mjs --win --x64 --publish=never
          bun run verify:opencode-cli:packaged
      - name: Check generated installer and checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem packages/electron/dist -Filter '*-win-x64.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Windows NSIS installer missing' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "installer=$($exe.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "source_sha=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-integration-windows-${{ github.sha }}
          path: |
            packages/electron/dist/*-win-x64.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
          if-no-files-found: error
          retention-days: 7
