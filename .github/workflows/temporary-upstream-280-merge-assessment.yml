name: Temporary upstream 2.8.0 integration
on:
  push:
    branches: [feature/upstream-280-p1-worktree-20261123]
permissions:
  contents: write
jobs:
  merge-upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Merge v2.8.0 while preserving fork policy and preparing TS migration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$(git log -1 --format=%s)" == 'chore: merge upstream OpenChamber v2.8.0 into RU fork (P1 port pending)' ]]; then
            echo 'Integration already applied; no merge required.'
            exit 0
          fi
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git remote add upstream https://github.com/openchamber/openchamber.git
          git fetch --no-tags upstream refs/tags/v2.8.0:refs/tags/upstream-v2.8.0
          git merge --no-commit --no-ff -X ours refs/tags/upstream-v2.8.0 || true
          mapfile -t unmerged < <(git diff --name-only --diff-filter=U)
          echo "UPSTREAM_UNMERGED_COUNT=${#unmerged[@]}"
          if (( ${#unmerged[@]} != 74 )); then
            echo 'Unexpected conflict count; aborting automatic resolution' >&2
            exit 4
          fi
          for p in "${unmerged[@]}"; do
            case "$p" in
              .github/workflows/*)
                # Fork intentionally removes upstream privileged/bot workflows.
                git rm -f -- "$p"
                ;;
              packages/web/server/lib/*.js|packages/web/server/lib/*.d.ts)
                # Upstream moved the live implementation to TS. Remove stale JS
                # only; P1-specific behavior must be re-ported to TS separately.
                git rm -f -- "$p"
                ;;
              *)
                # UI areas redesigned upstream; preserve their 2.8 implementation.
                if git ls-files -u -- "$p" | awk '$3==3 {found=1} END {exit !found}'; then
                  git checkout --theirs -- "$p"
                  git add -- "$p"
                else
                  # The upstream UI component was removed in a refactor.
                  git rm -f -- "$p"
                fi
                ;;
            esac
          done
          test -z "$(git diff --name-only --diff-filter=U)"
          echo '=== P1 files requiring re-port ==='
          git status --short | grep -E 'root-execution|owner-checkpoint|root-service|git/service.ts|terminal/runtime.ts|server-frame/bootstrap-runtime.ts' || true
          # The runner token cannot modify .github/workflows. Preserve the fork's
          # exact workflow tree; update workflows later via reviewed GitHub API.
          git rm -r -f -- .github/workflows
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A
          git commit -m 'chore: merge upstream OpenChamber v2.8.0 into RU fork (P1 port pending)'
          git push origin HEAD:feature/upstream-280-p1-worktree-20261123
