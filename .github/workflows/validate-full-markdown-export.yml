name: Validate full Markdown export

on:
  push:
    branches:
      - feature/full-markdown-export

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-markdown-export
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused tests
        run: bun test packages/ui/src/lib/exportSession.test.ts packages/ui/src/lib/fullSessionExport.test.ts

      - name: Type-check UI
        run: cd packages/ui && bun run type-check

      - name: Remove validation workflow
        run: |
          rm .github/workflows/validate-full-markdown-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-full-markdown-export.yml
          git commit -m "chore: remove full Markdown export validation workflow"
          git push origin HEAD:feature/full-markdown-export
