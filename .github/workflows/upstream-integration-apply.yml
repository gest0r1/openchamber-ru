name: Apply verified upstream integration

on:
  push:
    branches:
      - integration/upstream-2026-09-18
    paths:
      - .github/workflows/upstream-integration-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-upstream-2026-09-18
  cancel-in-progress: false

jobs:
  merge-and-test:
    if: github.ref == 'refs/heads/integration/upstream-2026-09-18'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      UPSTREAM_SHA: 01af9bb1bf99eb7647c5366d7675195f319f81c8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Merge exactly pinned upstream into disposable checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C integration/upstream-2026-09-18
          git fetch --no-tags https://github.com/openchamber/openchamber.git "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git merge --no-ff -m "merge: upstream OpenChamber ${UPSTREAM_SHA}" FETCH_HEAD
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          git status --short
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Compile SDK extensions and web distribution
        run: |
          set -Eeuo pipefail
          bun run --cwd packages/sdk build
          bun run extensions:build
          bun run build:web
      - name: Full repository regression suite
        run: bun run test
      - name: Check merge did not dirty tracked repository state
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
      - name: Push tested merge to integration branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = 'integration/upstream-2026-09-18'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git push origin HEAD:refs/heads/integration/upstream-2026-09-18
          echo "Verified upstream merge committed: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production main and installed runtimes were not modified.' >> "$GITHUB_STEP_SUMMARY"
